version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ato_shield_db
    environment:
      POSTGRES_DB: ato_shield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ATO Shield Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ato_shield_app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ato_shield
      API_SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - ./engine/models:/app/engine/models

volumes:
  postgres_data:
